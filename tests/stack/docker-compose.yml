name: ha-ghostfolio-test
services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: gf-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghostfolio-db
      POSTGRES_USER: ghostfolio
      POSTGRES_PASSWORD: ghostfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ghostfolio-db -U ghostfolio"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:alpine
    container_name: gf-test-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "ghostfolio"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass ghostfolio ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  ghostfolio:
    image: docker.io/ghostfolio/ghostfolio:latest
    container_name: gf-test-app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ACCESS_TOKEN_SALT: ci-access-token-salt
      JWT_SECRET_KEY: ci-jwt-secret-please-change
      DATABASE_URL: postgresql://ghostfolio:ghostfolio@postgres:5432/ghostfolio-db?connect_timeout=300
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ghostfolio
      HOST: 0.0.0.0
      PORT: "3333"
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
