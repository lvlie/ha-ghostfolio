name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Python version required by the
  # pytest-homeassistant-custom-component pin in requirements_test.txt.
  DEFAULT_PYTHON: "3.13"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Run pytest against the real Home Assistant test harness
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration-test:
    name: Spin up Ghostfolio + Home Assistant
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Start Ghostfolio (Postgres + Redis + app)
        working-directory: tests/stack
        run: |
          docker compose up -d
          echo "Waiting for Ghostfolio to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3333/api/v1/health >/dev/null 2>&1; then
              echo "Ghostfolio is up."
              exit 0
            fi
            sleep 5
          done
          echo "Ghostfolio failed to start in time."
          docker compose logs
          exit 1

      - name: Bootstrap a Ghostfolio user with positions
        id: bootstrap
        run: |
          python tests/stack/bootstrap_ghostfolio.py \
            --url http://localhost:3333 \
            --output ghostfolio.env
          set -a
          . ./ghostfolio.env
          set +a
          echo "GHOSTFOLIO_TOKEN=${GHOSTFOLIO_TOKEN}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends ffmpeg libturbojpeg0-dev

      - name: Install Home Assistant
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          # requirements_test.txt pins pytest-homeassistant-custom-component,
          # which in turn pins the exact Home Assistant release. Installing it
          # here keeps this job on the same core version as the unit tests.
          pip install -r requirements_test.txt

      - name: Stage Home Assistant config with the integration loaded
        run: |
          python tests/stack/setup_ha_config.py \
            --config-dir ha_config \
            --url http://localhost:3333 \
            --token "${GHOSTFOLIO_TOKEN}"

      - name: Start Home Assistant and capture logs
        run: |
          . .venv/bin/activate
          mkdir -p ha_config
          # Run HA in the background and stop it once we've seen "Started" or hit the timeout.
          python tests/stack/run_ha.py --config-dir ha_config --timeout 240 \
            | tee ha.log

      - name: Verify the integration loaded without errors
        run: |
          python tests/stack/check_logs.py ha.log

      - name: Upload Home Assistant log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-assistant-log
          path: ha.log
          if-no-files-found: ignore

      - name: Dump Ghostfolio logs on failure
        if: failure()
        working-directory: tests/stack
        run: docker compose logs --no-color | tail -n 400

      - name: Tear down Ghostfolio
        if: always()
        working-directory: tests/stack
        run: docker compose down -v
