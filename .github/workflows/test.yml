name: test

on:
  push:
    branches: [main]
  pull_request:
  # Monthly compatibility sweep against HA beta / dev to catch upstream
  # breakage before it lands in stable. 1st of every month at 06:00 UTC.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Python version required by the
  # pytest-homeassistant-custom-component pin in requirements_test.txt.
  # 0.13.365 (Home Assistant 2026.9.2) requires Python 3.14 or newer.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Run pytest against the real Home Assistant test harness
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration-test:
    name: HA ${{ matrix.ha_version }} + Ghostfolio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests test against `stable` only. Scheduled runs
        # and manual dispatches also test `beta` and `dev` to surface upcoming
        # Home Assistant breakage before it reaches users.
        ha_version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["stable","beta","dev"]' || '["stable"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Start Ghostfolio (Postgres + Redis + app)
        working-directory: tests/stack
        run: |
          docker compose up -d
          echo "Waiting for Ghostfolio to become healthy..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3333/api/v1/health >/dev/null 2>&1; then
              echo "Ghostfolio is up."
              exit 0
            fi
            sleep 5
          done
          echo "Ghostfolio failed to start in time."
          docker compose logs
          exit 1

      - name: Bootstrap a Ghostfolio user with positions
        run: |
          python tests/stack/bootstrap_ghostfolio.py \
            --url http://localhost:3333 \
            --output ghostfolio.env
          set -a
          . ./ghostfolio.env
          set +a
          echo "GHOSTFOLIO_TOKEN=${GHOSTFOLIO_TOKEN}" >> "$GITHUB_ENV"

      - name: Stage Home Assistant config with the integration loaded
        run: |
          python tests/stack/setup_ha_config.py \
            --config-dir ha_config \
            --url http://localhost:3333 \
            --token "${GHOSTFOLIO_TOKEN}"

      - name: Start Home Assistant ${{ matrix.ha_version }}
        run: |
          # Host networking so the container reaches the Ghostfolio stack on
          # localhost:3333, the same URL the staged config entry uses.
          docker run -d \
            --name homeassistant \
            --network host \
            -v "$(pwd)/ha_config:/config" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha_version }}

      - name: Verify the integration loaded, set up and fetched data
        run: python tests/stack/check_logs.py ha_config/home-assistant.log --wait 300

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "----- docker logs homeassistant -----"
          docker logs homeassistant 2>&1 | tail -n 200 || true
          echo "----- ghostfolio -----"
          docker compose -f tests/stack/docker-compose.yml logs --no-color | tail -n 200

      - name: Upload Home Assistant log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: home-assistant-log-${{ matrix.ha_version }}
          path: ha_config/home-assistant.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker rm -f homeassistant || true
          docker compose -f tests/stack/docker-compose.yml down -v
